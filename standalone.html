      // Ép buộc chuyển hướng sang kết nối bảo mật HTTPS (SSL/TLS) trên mọi máy chủ web
      (function() {
        try {
          if (typeof window !== 'undefined' && window.location) {
            var proto = window.location.protocol;
            var host = window.location.hostname;
            // Chỉ bỏ qua trên máy tính cá nhân nội bộ (localhost, 127.0.0.1, file://)
            var isLocal = host === 'localhost' || host === '127.0.0.1' || host === '' || host.indexOf('192.168.') === 0 || host.indexOf('10.') === 0 || proto === 'file:';
            if (proto === 'http:' && !isLocal) {
              window.location.replace('https://' + window.location.host + window.location.pathname + window.location.search + window.location.hash);
            }
          }
        } catch (e) {}
      })();
