<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#6366f1"/>
      <stop offset="85%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <linearGradient id="rimGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.85)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="100%" stop-color="rgba(56,189,248,0.4)"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#fdf4ff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.5"/>
      <feDropShadow dx="0" dy="0" stdDeviation="24" flood-color="#38bdf8" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="128" fill="#050508"/>
  
  <!-- Liquid Glass Outer Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGlow)" filter="url(#shadow)"/>
  
  <!-- Specular Rim Light -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="none" stroke="url(#rimGlow)" stroke-width="4"/>
  
  <!-- Specular Hotspot Highlight -->
  <ellipse cx="256" cy="140" rx="160" ry="70" fill="white" opacity="0.15"/>

  <!-- High-Gloss Crystal Thunderbolt -->
  <path d="M280 64 L144 264 L256 264 L232 448 L368 248 L256 248 Z" 
        fill="url(#bolt)" 
        stroke="rgba(255,255,255,0.8)" 
        stroke-width="6" 
        stroke-linejoin="round"
        filter="drop-shadow(0 0 16px rgba(255,255,255,0.8))"/>
</svg>
